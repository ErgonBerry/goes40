<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-4xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Admin Dashboard</h1>

        <!-- Formulário para adicionar convidados -->
        <form action="/admin/add" method="POST" class="mb-8">
            <div class="grid grid-cols-2 gap-4">
                <p class="text-gray-700"><span class="font-semibold">Total de Adultos Confirmados:</span> {{ .TotalAdults }}</p>
                <p class="text-gray-700"><span class="font-semibold">Total de Crianças Confirmadas:</span> {{ .TotalChildren }}</p>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">Telefone:</label>
                    <input type="text" id="phone" name="phone" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Nome:</label>
                    <input type="text" id="name" name="name" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
            </div>
            <button type="submit" class="mt-4 w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-300">
                Adicionar Convidado
            </button>
        </form>

        <!-- Tabela de convidados -->
        <h2 class="text-xl font-bold text-gray-800 mb-4">Lista de Convidados</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-300">
                <thead>
                    <tr>
                        <th class="px-4 py-2 border-b">Telefone</th>
                        <th class="px-4 py-2 border-b">Nome</th>
                        <th class="px-4 py-2 border-b">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {{ range .Guests }}
                    <tr>
                        <td class="px-4 py-2 border-b">{{ .Phone }}</td>
                        <td class="px-4 py-2 border-b">{{ .Name }}</td>
                        <td class="px-4 py-2 border-b">
                            <form action="/admin/delete" method="POST" class="inline">
                                <input type="hidden" name="phone" value="{{ .Phone }}">
                                <button type="submit" class="text-red-500 hover:text-red-700">Remover</button>
                            </form>
                        </td>
                    </tr>
                    {{ end }}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
