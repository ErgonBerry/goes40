<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Confirmação de Presença</h1>
        <div class="space-y-4">
            <p class="text-gray-700"><span class="font-semibold">Telefone:</span> {{ .Phone }}</p>
            <p class="text-gray-700"><span class="font-semibold">Adultos:</span> {{ .Adults }}</p>
            <p class="text-gray-700"><span class="font-semibold">Crianças:</span> {{ .Children }}</p>
        </div>

        <!-- Mapa da localização -->
        <div class="mt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Localização da Festa</h2>
            <iframe
                class="w-full h-48 rounded-lg"
                src="https://www.google.com.br/maps/place/Ch%C3%A1cara+Beija+Flor/@-23.3341654,-47.6319317,132502m/data=!3m1!1e3!4m14!1m7!3m6!1s0x94c59b50ca291b2d:0x1143ddce6296aaf!2sCh%C3%A1cara+Beija+Flor!8m2!3d-23.6973593!4d-47.6133483!16s%2Fg%2F11f5v8swd8!3m5!1s0x94c59b50ca291b2d:0x1143ddce6296aaf!8m2!3d-23.6973593!4d-47.6133483!16s%2Fg%2F11f5v8swd8?entry=ttu&g_ep=EgoyMDI1MDIxOC4wIKXMDSoASAFQAw%3D%3D"
                allowfullscreen
                loading="lazy">
            </iframe>
        </div>

        <!-- Botão para enviar localização via WhatsApp -->
        <div class="mt-6">
            <a
                href="https://api.whatsapp.com/send?phone={{ .Phone }}&text=Olá! Aqui está a localização da festa: https://maps.app.goo.gl/CwZUJxumebwYj1rN9"
                target="_blank"
                class="w-full bg-green-500 text-white py-2 px-4 rounded-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 transition duration-300 block text-center mb-4">
                Enviar Localização via WhatsApp
            </a>
        </div>

        <!-- Botão para fechar (redireciona para a página inicial) -->
        <div class="mt-4">
            <button
                onclick="window.location.href='/thanks'"
                class="w-full bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 transition duration-300 block text-center">
                Fechar
            </button>
        </div>
    </div>
</body>
</html>
