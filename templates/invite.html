<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Confirmação de Presença</h1>
        <form action="/step1" method="GET" class="space-y-4">
            <div class="space-y-4">
                <p class="text-gray-700"><span class="font-semibold">Você foi convidado(a) à festa de Aniversário do DODO</p>
            </div>

            <!-- Mapa da localização -->
            <div class="mt-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Nos dias 09 e 10 de Agosto 2025</h2>
                <p class="text-gray-700"><span class="font-semibold">em Salto de Pirapora SP</p>
            </div>

            <!-- Botão para fechar (redireciona para a página inicial) -->
            <div class="mt-4">
                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300">
                    Iniciar
                </button>
            </div>
            </form>
    </div>
</body>
</html>
