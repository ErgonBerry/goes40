<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite para o Aniversário do Dodo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Você foi convidado(a) para o aniversário do Dodo!</h1>
        
        <!-- Detalhes do evento -->
        <div class="space-y-4">
            <p class="text-gray-700">Nos dias <span class="font-semibold">09 e 10 de Agosto de 2025</span>.</p>
            <p class="text-gray-700">Na cidade de <span class="font-semibold">Salto de Pirapora, SP</span>.</p>
            <p class="text-sm text-gray-500">Localização do evento enviaremos no final dessa confirmação</p>
        </div>

        <!-- Botão para confirmar presença -->
        <div class="mt-6">
            <a
                href="/step1"
                class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 block text-center">
                Confirme aqui
            </a>
        </div>
    </div>
</body>
</html>
